<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mockup - 03 Editor Desain</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap');
        body { font-family: 'Patrick Hand', 'Comic Sans MS', cursive; background-color: #e5e5e5; color: #000; display: flex; justify-content: center; padding: 40px; }
        .wf-container { width: 1024px; min-height: 768px; background: #fff; border: 2px solid #000; box-shadow: 4px 4px 0 #000; display: flex; flex-direction: column; }
        .wf-border { border: 2px solid #000; }
        .wf-border-b { border-bottom: 2px solid #000; }
        .wf-border-r { border-right: 2px solid #000; }
        .wf-border-l { border-left: 2px solid #000; }
        .wf-btn { border: 2px solid #000; padding: 6px 16px; background: #fff; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .icon-placeholder { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border: 2px solid #000; border-radius: 50%; font-size: 10px; }
        .img-placeholder { border: 2px solid #000; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; background: #fff; }
        .img-placeholder::before, .img-placeholder::after { content: ''; position: absolute; background: #000; }
        .img-placeholder::before { width: 150%; height: 2px; transform: rotate(45deg); }
        .img-placeholder::after { width: 150%; height: 2px; transform: rotate(-45deg); }
        .canvas-area { background-image: repeating-linear-gradient(45deg, #f0f0f0 25%, transparent 25%, transparent 75%, #f0f0f0 75%, #f0f0f0), repeating-linear-gradient(45deg, #f0f0f0 25%, #fff 25%, #fff 75%, #f0f0f0 75%, #f0f0f0); background-position: 0 0, 10px 10px; background-size: 20px 20px; }
        .browser-header { border-bottom: 2px solid #000; padding: 8px 16px; display: flex; align-items: center; gap: 8px; background: #fff; }
        .browser-dot { width: 12px; height: 12px; border: 2px solid #000; border-radius: 50%; }
        .browser-address { border: 2px solid #000; flex-grow: 1; padding: 2px 8px; font-size: 14px; border-radius: 12px; display: flex; align-items: center; gap: 8px; margin-left: 16px; }
    </style>
</head>
<body>
    <div class="wf-container">
        <!-- Browser UI -->
        <div class="browser-header">
            <div class="flex gap-2"><div class="browser-dot"></div><div class="browser-dot"></div><div class="browser-dot"></div></div>
            <div class="browser-address"><span>🔒</span> https://sistem-sablon.com/customer/design/1</div>
            <div class="browser-dot rounded-sm"></div>
        </div>

        <div class="wf-border-b p-3 flex flex-col px-4 bg-white">
            <div class="flex justify-between items-center mb-4">
                <div class="font-bold text-lg"><span class="mr-2">&larr;</span> Kembali ke Katalog</div>
                <h1 class="text-xl font-bold uppercase tracking-widest">SISTEM SABLON</h1>
                <div class="w-8 h-8 icon-placeholder rounded-full font-bold">👤</div>
            </div>
            
            <!-- Wizard Progress Bar -->
            <div class="flex justify-center items-center gap-4 mb-2">
                <div class="flex flex-col items-center">
                    <div class="w-8 h-8 rounded-full border-2 border-black bg-black text-white flex items-center justify-center font-bold mb-1">1</div>
                    <span class="text-xs font-bold">Pilih Warna</span>
                </div>
                <div class="w-16 h-0.5 bg-black"></div>
                <div class="flex flex-col items-center">
                    <div class="w-8 h-8 rounded-full border-2 border-black bg-white flex items-center justify-center font-bold mb-1">2</div>
                    <span class="text-xs font-bold text-gray-500">Desain Depan</span>
                </div>
                <div class="w-16 h-0.5 bg-gray-300"></div>
                <div class="flex flex-col items-center opacity-50">
                    <div class="w-8 h-8 rounded-full border-2 border-black bg-white flex items-center justify-center font-bold mb-1">3</div>
                    <span class="text-xs font-bold">Desain Belakang</span>
                </div>
                <div class="w-16 h-0.5 bg-gray-300"></div>
                <div class="flex flex-col items-center opacity-50">
                    <div class="w-8 h-8 rounded-full border-2 border-black bg-white flex items-center justify-center font-bold mb-1">4</div>
                    <span class="text-xs font-bold">Review</span>
                </div>
            </div>
        </div>

        <div class="flex flex-1 overflow-hidden">
            <!-- Main Canvas / Content Area -->
            <div class="flex-1 canvas-area flex flex-col items-center justify-center relative border-r-2 border-black p-8">
                <h2 class="text-2xl font-bold mb-6 text-center">Langkah 1: Pilih Warna Dasar Pakaian</h2>
                
                <!-- Mockup Image -->
                <div class="relative w-[350px] h-[450px]">
                    <div class="absolute inset-0 wf-border bg-white" style="border-radius: 20px 20px 0 0; opacity: 1;"></div>
                    <div class="absolute inset-0 flex justify-center pt-8">
                        <!-- T-shirt collar -->
                        <div class="w-32 h-10 border-b-2 border-black rounded-b-full"></div>
                    </div>
                </div>
            </div>

            <!-- Right Panel (Controls) -->
            <div class="w-80 p-6 flex flex-col gap-6 overflow-y-auto bg-gray-50">
                
                <div>
                    <h3 class="font-bold text-xl mb-4 border-b-2 border-black pb-2">Opsi Warna Dasar</h3>
                    <div class="grid grid-cols-4 gap-4">
                        <div class="w-12 h-12 rounded-full wf-border bg-white cursor-pointer ring-2 ring-black ring-offset-2 mx-auto"></div>
                        <div class="w-12 h-12 rounded-full wf-border bg-black cursor-pointer mx-auto"></div>
                        <div class="w-12 h-12 rounded-full wf-border bg-blue-500 cursor-pointer mx-auto"></div>
                        <div class="w-12 h-12 rounded-full wf-border bg-red-500 cursor-pointer mx-auto"></div>
                        <div class="w-12 h-12 rounded-full wf-border bg-green-500 cursor-pointer mx-auto"></div>
                        <div class="w-12 h-12 rounded-full wf-border bg-yellow-500 cursor-pointer mx-auto"></div>
                    </div>
                </div>

                <div class="mt-auto border-t-2 border-black pt-4">
                    <button class="wf-btn bg-black text-white w-full py-3 text-lg flex justify-between items-center" style="box-shadow: 4px 4px 0 #000;">
                        <span>Lanjut ke Desain Depan</span>
                        <span>&rarr;</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
