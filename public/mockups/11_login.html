<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mockup - 11 Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap');
        body { font-family: 'Patrick Hand', 'Comic Sans MS', cursive; background-color: #e5e5e5; color: #000; display: flex; justify-content: center; padding: 40px; }
        .wf-container { width: 1024px; min-height: 768px; background: #fff; border: 2px solid #000; box-shadow: 4px 4px 0 #000; display: flex; flex-direction: column; }
        .wf-border { border: 2px solid #000; }
        .wf-border-b { border-bottom: 2px solid #000; }
        .wf-btn { border: 2px solid #000; padding: 8px 16px; background: #fff; border-radius: 4px; font-weight: bold; cursor: pointer; box-shadow: 2px 2px 0 #000; width: 100%; text-align: center; display: block; }
        .wf-input { border: 2px solid #000; padding: 10px; background: #fff; border-radius: 4px; outline: none; width: 100%; }
        .icon-placeholder { display: inline-flex; align-items: center; justify-content: center; width: 64px; height: 64px; border: 2px solid #000; border-radius: 50%; font-size: 14px; margin-bottom: 16px; }
        .browser-header { border-bottom: 2px solid #000; padding: 8px 16px; display: flex; align-items: center; gap: 8px; background: #fff; }
        .browser-dot { width: 12px; height: 12px; border: 2px solid #000; border-radius: 50%; }
        .browser-address { border: 2px solid #000; flex-grow: 1; padding: 2px 8px; font-size: 14px; border-radius: 12px; display: flex; align-items: center; gap: 8px; margin-left: 16px; }
    </style>
</head>
<body>
    <div class="wf-container">
        <!-- Browser UI -->
        <div class="browser-header">
            <div class="flex gap-2"><div class="browser-dot"></div><div class="browser-dot"></div><div class="browser-dot"></div></div>
            <div class="browser-address"><span>🔒</span> https://sistem-sablon.com/login</div>
            <div class="browser-dot rounded-sm"></div>
        </div>

        <div class="flex-1 flex items-center justify-center bg-gray-50">
            <div class="wf-border bg-white w-[400px] p-8 rounded-xl shadow-lg relative">
                <!-- Decorative Elements -->
                <div class="absolute -top-3 -right-3 w-6 h-6 bg-gray-200 wf-border rotate-12"></div>
                
                <div class="flex flex-col items-center mb-6">
                    <div class="relative border-2 border-black bg-white mb-4" style="width: 120px; height: 60px;">
                        <svg class="absolute inset-0 w-full h-full text-gray-300" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
                            <line x1="0" y1="0" x2="100%" y2="100%" stroke="currentColor" stroke-width="1" />
                            <line x1="100%" y1="0" x2="0" y2="100%" stroke="currentColor" stroke-width="1" />
                        </svg>
                        <div class="absolute inset-0 flex items-center justify-center font-bold text-base z-10">
                            <span class="bg-white px-1">Logo</span>
                        </div>
                    </div>
                    <h2 class="text-2xl font-bold uppercase tracking-wider text-center">Login</h2>
                    <p class="text-gray-500 text-sm mt-2 text-center">Silakan masuk untuk mulai mendesain dan memesan baju.</p>
                </div>

                <div class="flex flex-col gap-4">
                    <div>
                        <label class="block font-bold mb-1">Email</label>
                        <input type="email" class="wf-input" placeholder="masukan email">
                    </div>
                    
                    <div>
                        <label class="block font-bold mb-1">Password</label>
                        <input type="password" class="wf-input" placeholder="masukan password">
                    </div>

                    <div class="flex justify-between items-center text-sm">
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="checkbox" class="w-4 h-4 wf-border">
                            <span>Ingat Saya</span>
                        </label>
                        <a href="#" class="font-bold underline">Lupa Password?</a>
                    </div>

                    <button class="wf-btn mt-4 text-lg" style="background-color: #000; color: #fff;">Masuk</button>
                    <a href="12_register.html" class="wf-btn mt-2 text-lg text-black bg-white text-center">Daftar</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
